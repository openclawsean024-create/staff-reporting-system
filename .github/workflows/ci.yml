name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true  # no eslint config → graceful
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps || npm install
      - name: Lint check (graceful)
        run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f .eslintrc.yml ] || [ -f eslint.config.mjs ] || [ -f eslint.config.js ]; then
            npm run lint
          else
            echo "no eslint config — skipping lint job"
            exit 0
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # no test script → graceful
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps || npm install
      - name: Syntax check api/submit.js
        run: node --check api/submit.js && echo "api/submit.js syntax OK"
      - name: Test (graceful)
        run: |
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "no test script — skipping"
          fi

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps || npm install
      - name: Build (graceful — no build script for static repo)
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          else
            echo "no build script — static HTML + Vercel API (vercel handles build)"
          fi
      - name: Verify static HTML files
        run: |
          for f in index.html dashboard.html pricing.html; do
            if [ -f "$f" ]; then
              echo "✓ $f ($(wc -c < $f) bytes)"
            else
              echo "✗ MISSING: $f"
              exit 1
            fi
          done
      - name: Verify Vercel config
        run: |
          if [ -f vercel.json ]; then
            echo "✓ vercel.json present"
            cat vercel.json
          else
            echo "no vercel.json"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Note
        run: |
          echo "ℹ️  Deploy target: vercel (handled by Vercel GitHub App, not GHA)"
          echo "ℹ️  GHA only runs lint/test/build sanity checks."
          echo "ℹ️  See https://staff-reporting-system.vercel.app"
